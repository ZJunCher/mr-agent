  changes_summary: |
    ...
{%- endif %}
  changes_title: |
    ...
  label: |
    enhancement
...
{%- endif %}
```

Answer must be valid YAML only. Each YAML output MUST be after a newline, properly indented, using block scalar indicator ('|') where applicable.
