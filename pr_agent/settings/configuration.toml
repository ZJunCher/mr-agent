[distributed]
execution_mode = "inline"
redis_url = ""
web_workers = 2
agent_workers = 3
worker_max_active_tasks = 4
worker_inbox_prefetch = 32
worker_heartbeat_seconds = 5
worker_dead_seconds = 20
worker_degraded_lag_seconds = 5
worker_shutdown_grace_seconds = 120
