# Important: This file contains all available configuration options.
# Do not copy this entire file to your repository configuration.
# Your repository configuration should only include options you wish to override from the defaults.
#
# Use this page: 'https://qodo-merge-docs.qodo.ai/ai_search/' to ask questions about the configuration options.

[config]
# models
model="gpt-5.2-2025-12-11"
fallback_models=["o4-mini"]
model_retry_limit=2
model_retry_base_seconds=1.0
model_retry_max_seconds=8.0
independent_fallback_models=["anthropic/claude-haiku-4-5-20251001"]
model_reasoning="anthropic/claude-opus-4-8" # dedicated reasoning model for self-reflection, independent of config.model
#model_weak="gpt-4o" # optional, a weaker model to use for some easier tasks
# CLI
git_provider="github"
publish_output=true
publish_output_progress=true
verbosity_level=0 # 0,1,2
use_extra_bad_extensions=false
# Log
log_level="DEBUG"
# Configurations
use_wiki_settings_file=true
use_repo_settings_file=true
use_global_settings_file=true
disable_auto_feedback = false
ai_timeout=120 # 2minutes
skip_keys = []
custom_reasoning_model = false # when true, disables system messages and temperature controls for models that don't support chat-style inputs
response_language="zh-CN" # Language locales code for PR responses in ISO 3166 and ISO 639 format (e.g., "en-US", "it-IT", "zh-CN", ...)
# token limits
max_description_tokens = 500
max_commits_tokens = 500
max_model_tokens = 32000 # Limits the maximum number of tokens that can be used by any model, regardless of the model's default capabilities.
custom_model_max_tokens=-1 # for models not in the default list
model_token_count_estimate_factor=0.3 # factor to increase the token count estimate, in order to reduce likelihood of model failure due to too many tokens - applicable only when requesting an accurate estimate.
# patch extension logic
patch_extension_skip_types =[".md",".txt"]
allow_dynamic_context=true
max_extra_lines_before_dynamic_context = 10 # will try to include up to 10 extra lines before the hunk in the patch, until we reach an enclosing function or class
patch_extra_lines_before = 5 # Number of extra lines (+3 default ones) to include before each hunk in the patch
patch_extra_lines_after = 1 # Number of extra lines (+3 default ones) to include after each hunk in the patch
secret_provider="" # "" (disabled), "google_cloud_storage", or "aws_secrets_manager" for secure secret management
cli_mode=false
ai_disclaimer_title=""  # Pro feature, title for a collapsible disclaimer to AI outputs
ai_disclaimer=""  # Pro feature, full text for the AI disclaimer
output_relevant_configurations=false
large_patch_policy = "clip" # "clip", "skip"
duplicate_prompt_examples = false
# seed
seed=-1 # set positive value to fix the seed (and ensure temperature=0)
temperature=0.2
# bring repo metadata 💎
add_repo_metadata=false # if true, will try to add metadata from files like 'AGENTS.MD', 'CLAUDE.MD', 'QODO.MD'
add_repo_metadata_file_list =["AGENTS.MD", "CLAUDE.MD", "QODO.MD"]
# ignore logic
ignore_pr_title = ["^\\[Auto\\]", "^Auto"] # a list of regular expressions to match against the PR title to ignore the PR agent
ignore_pr_target_branches = [] # a list of regular expressions of target branches to ignore from PR agent when an PR is created
ignore_pr_source_branches = [] # a list of regular expressions of source branches to ignore from PR agent when an PR is created
ignore_pr_labels = [] # labels to ignore from PR agent when an PR is created
ignore_pr_authors = [] # authors to ignore from PR agent when an PR is created
ignore_repositories = [] # a list of regular expressions of repository full names (e.g. "org/repo") to ignore from PR agent processing
ignore_language_framework = [] # a list of code-generation languages or frameworks (e.g. 'protobuf', 'go_gen') whose auto-generated source files will be excluded from analysis
ignore_third_party_imports = true # if true, strip newly added import lines for third-party packages in Python/JS/TS patches
#
is_auto_command = false # will be auto-set to true if the command is triggered by an automation
enable_ai_metadata = false # will enable adding ai metadata
reasoning_effort = "medium" # "low", "medium", "high"
# auto approval 💎
enable_auto_approval=false # Set to true to enable auto-approval of PRs under certain conditions
auto_approve_for_low_review_effort=-1 # -1 to disable, [1-5] to set the threshold for auto-approval
auto_approve_for_no_suggestions=false # If true, the PR will be auto-approved if there are no suggestions
ensure_ticket_compliance=false # Set to true to disable auto-approval of PRs if the ticket is not compliant
# extended thinking for Claude reasoning models
enable_claude_extended_thinking = false # Set to true to enable extended thinking feature
extended_thinking_budget_tokens = 2048
extended_thinking_max_output_tokens = 4096

[large_mr_review] # complete Map-Reduce coverage for /review and /improve #
enabled = true
output_buffer_tokens = 1500
chunk_metadata_tokens = 256
max_chunks = 20
max_concurrency = 4
fail_closed = true


[pr_reviewer] # /review #
# enable/disable features
require_score_review=false
require_tests_review=false
require_estimate_effort_to_review=true
require_can_be_split_review=false
require_security_review=true
require_estimate_contribution_time_cost=false
require_todo_scan=false
require_ticket_analysis_review=true
# general options
publish_output_no_suggestions=true # Set to "false" if you only need the reviewer's remarks (not labels, not "security audit", etc.) and want to avoid noisy "No major issues detected" comments.
persistent_comment=true
extra_instructions = ""
num_max_findings = 3
final_update_message = true
# review labels
enable_review_labels_security=true
enable_review_labels_effort=true
# specific configurations for incremental review (/review -i)
require_all_thresholds_for_incremental_review=false
minimal_commits_for_incremental_review=0
minimal_minutes_for_incremental_review=0
enable_intro_text=true
enable_help_text=false # Determines whether to include help text in the PR review. Enabled by default.
enable_feedback_hint=true # append a hint at the end of the review inviting users to rate it via /feedback

[project_review_skill]
# Project-owned declarative review rules are read only from the MR target branch SHA.
# disabled | shadow | review_only | review_and_improve
rollout_mode = "review_and_improve"

[pr_reviewer.code_graph] # file-level dependency context for /review - see docs/superpowers/specs/2026-07-14-code-graph-context-design.md
enabled = true # opt-in; existing review behavior is unchanged until this is flipped to true
supported_languages = ["python", "cpp"]
max_hops = 2 # dependency traversal depth, both forward (files the changed file imports) and reverse (files that import the changed file)
token_budget = 8000 # max tokens spent on related-files context, on top of the PR diff itself
clone_timeout_seconds = 60
parse_timeout_seconds = 30
stale_graph_ttl_days = 15 # branch clones/graphs unused for this many days are deleted and rebuilt on next use
storage_root = "/app/data/code_graph" # mount on a host volume in production so clones and graphs survive container restarts

[pr_feedback] # /feedback (alias /rate) #
# Collect user ratings/comments about review results for later analysis.
# storage_path points to a single SQLite file; in production mount it on a host
# volume (e.g. -v /opt/pr-agent/data:/app/data) so data survives restarts.
storage_path = "/app/data/feedback/review_feedback.db"
min_score = 1
max_score = 5
gate_enabled = false                       # master switch for the mandatory-feedback merge gate
gate_status_context = "pr-agent/feedback"  # GitLab commit status name used to block/unblock merge
comment_required_below = 5                 # comment is mandatory when score < this value (5 = full mark needs no comment)

[pr_inline_suggestion_gate] # gate that blocks merge until every published inline suggestion is applied or resolved #
gate_enabled = false                                # master switch; OFF for all projects (gate disabled 2026-07-10 per user request)
gate_status_context = "pr-agent/inline-suggestions（请查看下方建议）"  # commit status name, independent from pr-agent/feedback; wording nudges reviewers to scroll down to the inline suggestions
gate_project_allowlist = ["cook"]                    # gray-rollout scope; unlisted projects are fully unaffected even if gate_enabled=true; "*" opens to all. chogori pending, add after cook is verified.

[pr_mr_create.report_export] # download link appended to the mr_create combined summary, see docs/superpowers/specs/2026-07-16-report-export-design.md #
enabled = true # additive, best-effort: on any failure the download line is simply omitted, main comment is unaffected

[eval] # offline evaluation / replay benchmark (additive, opt-in) #
# When enabled, reviews are stamped with a hidden pr-agent-eval marker freezing
# the exact code state (base/head/start sha + model + small config snapshot),
# and a baseline "review_run" is persisted when a user scores via /feedback.
# This is required to later replay the same PRs against new prompts/models.
# Toggle without rebuilding via env var EVAL__ENABLE_CAPTURE=true|false.
enable_capture = true
# review_runs live alongside review_feedback (joined by review_id). Leave empty
# to reuse pr_feedback.storage_path.
storage_path = ""
# replay results (P1) are written to a separate file to isolate write locks.
benchmark_db_path = "/app/data/eval/benchmark_eval.db"
# optional: only needed for the GitPython local-clone replay fallback.
repos_root = ""

[pr_description] # /describe #
publish_labels=false
add_original_user_description=false
generate_ai_title=false
use_bullet_points=true
extra_instructions = ""
enable_pr_type=false
final_update_message = true
enable_help_text=false
enable_help_comment=false
enable_pr_diagram=true # adds a section with a diagram of the PR changes
# describe as comment
publish_description_as_comment=false
publish_description_as_comment_persistent=false
## changes walkthrough section
enable_semantic_files_types=true
collapsible_file_list='adaptive' # true, false, 'adaptive'
collapsible_file_list_threshold=6
inline_file_summary=false # false, true, 'table'
# markers
use_description_markers=false
include_generated_by_header=true
# large pr mode 💎
enable_large_pr_handling=true
max_ai_calls=4
async_ai_calls=true
#custom_labels = ['Bug fix', 'Tests', 'Bug fix with tests', 'Enhancement', 'Documentation', 'Other']

[pr_questions] # /ask #
enable_help_text=false
use_conversation_history=true


[pr_code_suggestions] # /improve #
commitable_code_suggestions = false
dual_publishing_score_threshold=-1 # -1 to disable, [0-10] to set the threshold (>=) for publishing a code suggestion both in a table and as commitable
focus_only_on_problems=true
# inline suggestion dual-publishing (phase 1, additive; publishes selected /improve
# suggestions as GitLab-native inline suggestions on the exact diff lines).
# Test config: it runs via mr_create and only for allowlisted projects.
inline_suggestions_enabled = true                  # master switch for the inline-suggestion sub-feature
inline_suggestions_on_mr_create = true             # publish inline suggestions from the mr_create flow
inline_suggestions_on_improve_command = true       # publish inline suggestions when a user manually runs /improve
inline_suggestions_project_allowlist = ["*"] # "*" = all projects (company-wide rollout); or list specific paths/ids for gray release
inline_suggestion_min_score = 0                    # only publish suggestions with score >= this value (0 = publish all, test phase)
inline_suggestion_max_lines = 50                   # skip one-click Apply when the replaced range exceeds this many lines
inline_suggestion_keep_summary_comment = true      # keep the original /improve summary comment as well
inline_suggestions_storage_path = ""               # empty -> reuse pr_feedback.storage_path
inline_suggestion_collapsed = false                # wrap the suggestion code block in <details> (false = always expanded, so users see the suggestion at first glance)
inline_publish_retry_limit = 1                      # refresh the MR diff and retry a rejected position once
inline_publish_fallback_comment = true              # preserve rejected inline suggestions as ordinary MR comments
# pre-publish heuristic gate (phase 1): block inline suggestions that are likely
# incomplete or unsafe to one-click apply; blocked ones stay in the summary only.
inline_gate_enabled = true                         # master switch for the heuristic gate
inline_gate_check_new_symbol = true                # block when improved_code uses symbols absent from the file (G1)
inline_gate_check_new_dependency = true            # block when improved_code adds #include/import not in the file (G2)
inline_gate_check_cross_file = true                # block when the suggestion asks to modify another file (G3)
inline_gate_check_incomplete = true                # block ellipsis markers / brace imbalance / existing_code mismatch (G4)
inline_gate_check_speculative = true               # block speculative categories (G5)
inline_gate_speculative_labels = ["performance"]   # labels treated as speculative for G5
# self-check (phase 2): lightweight LLM validation of the phase-1 survivors.
# 2A checks each suggestion is a complete/safe self-contained fix; 2B resolves
# cross-suggestion conflicts so multiple can be one-click applied together.
inline_selfcheck_enabled = true                    # master switch for phase-2 self-check (2A)
inline_selfcheck_model = "anthropic/claude-opus-4-8" # lightweight judge model, independent of the main model
inline_selfcheck_fail_action = "skip"              # on error: skip=block (fail-closed, default) / pass=publish
inline_selfcheck_max_candidates = 5                # cap self-checked suggestions per MR (cost guard)
inline_conflict_check_enabled = true               # master switch for phase-2 batch de-conflict (2B)
inline_conflict_adjacency_lines = 3                # line distance <= this counts as adjacent (conflict signal)
inline_conflict_fail_action = "keep_top1"          # on de-conflict error: keep only the highest-scored suggestion
# Pipeline v2 (generate-then-repair): stricter self-reflect standard + a three-tier
# repair chain (deterministic -> Tier-1 small model -> Tier-2 heavy Copilot CLI
# channel) so suggestions that survive review are actively fixed to be one-click
# appliable instead of filtered out downstream. See docs/superpowers/specs/2026-07-10-improve-pipeline-overhaul-design.md
pipeline_v2_enabled = true                         # master switch; true enables the generate-then-repair pipeline
fix_fuzzy_match_threshold = 0.85                   # deterministic-fix existing_code fuzzy-match similarity threshold
tier1_repair_model = ""                            # empty -> reuse inline_selfcheck_model
tier1_repair_max_retries = 2                        # max small-model repair attempts per unresolved suggestion/task
tier2_enabled = true                               # independent switch for the Copilot CLI heavy-repair channel;
                                                    # Copilot CLI login on the server confirmed working (2026-07-11) --
                                                    # flipping it off never affects stages (1)-(4) above
tier2_timeout_seconds = 480                        # single Tier-2 session timeout (clone + Copilot CLI run)
tier2_clone_depth = 1                               # shallow-clone depth for the Tier-2 workdir
# scenario validator (applies to all /improve outputs, not only inline)
scenario_validation_enabled = true                 # master switch for scenario-specific filtering
scenario_validation_model = "anthropic/claude-opus-4-8" # judge model for scenario clarity/extreme checks
scenario_validation_fail_action = "skip"           # on error: skip=block suggestions (fail-closed) / pass=keep
scenario_validation_max_candidates = 30            # cost guard; candidates above this cap are handled by local strict check only
filter_persistence_enabled = true                    # persist cross-review (scenario_validation) filtered suggestions to filtered_suggestions table for dashboard
#
extra_instructions = ""
enable_help_text=false
enable_chat_text=false
persistent_comment=true
max_history_len=4
publish_output_no_suggestions=true
# enable to apply suggestion 💎
apply_suggestions_checkbox=true
# suggestions scoring
suggestions_score_threshold=7 # [0-10]| recommend not to set this value above 8, since above it may clip highly relevant suggestions
new_score_mechanism=true
new_score_mechanism_th_high=9
new_score_mechanism_th_medium=7
# params for '/improve --extended' mode
auto_extended_mode=true
num_code_suggestions_per_chunk=3
num_best_practice_suggestions=1 # 💎
max_number_of_calls = 3
parallel_calls = true

final_clip_factor = 0.8
decouple_hunks = false
# self-review checkbox
demand_code_suggestions_self_review=false # add a checkbox for the author to self-review the code suggestions
code_suggestions_self_review_text= "**Author self-review**: I have reviewed the PR code suggestions, and addressed the relevant ones."
approve_pr_on_self_review=false # Pro feature. if true, the PR will be auto-approved after the author clicks on the self-review checkbox
fold_suggestions_on_self_review=true # Pro feature. if true, the code suggestions will be folded after the author clicks on the self-review checkbox
# Suggestion impact 💎
publish_post_process_suggestion_impact=true
wiki_page_accepted_suggestions=true
allow_thumbs_up_down=false

[pr_custom_prompt] # /custom_prompt #
prompt = """\
The code suggestions should focus only on the following:
- ...
- ...
...
"""
suggestions_score_threshold=0
num_code_suggestions_per_chunk=3
self_reflect_on_custom_suggestions=true
enable_help_text=false


[pr_add_docs] # /add_docs #
extra_instructions = ""
docs_style = "Sphinx" # "Google Style with Args, Returns, Attributes...etc", "Numpy Style", "Sphinx Style", "PEP257", "reStructuredText"
file = ""              # in case there are several components with the same name, you can specify the relevant file
class_name = ""        # in case there are several methods with the same name in the same file, you can specify the relevant class name

[pr_update_changelog] # /update_changelog #
push_changelog_changes=false
extra_instructions = ""
add_pr_link=true
skip_ci_on_push=true

[pr_analyze] # /analyze #
enable_help_text=true

[pr_test] # /test #
extra_instructions = ""
testing_framework = "" # specify the testing framework you want to use
num_tests=3            # number of tests to generate. max 5.
avoid_mocks=true       # if true, the generated tests will prefer to use real objects instead of mocks
file = ""              # in case there are several components with the same name, you can specify the relevant file
class_name = ""        # in case there are several methods with the same name in the same file, you can specify the relevant class name
enable_help_text=false

[pr_improve_component] # /improve_component #
num_code_suggestions=4
extra_instructions = ""
file = ""              # in case there are several components with the same name, you can specify the relevant file
class_name = ""        # in case there are several methods with the same name in the same file, you can specify the relevant class name

[checks] # /checks (pro feature) #
enable_auto_checks_feedback=true
excluded_checks_list=["lint"] # list of checks to exclude, for example: ["check1", "check2"]
persistent_comment=true
enable_help_text=true
final_update_message = false

[pr_help] # /help #
force_local_db=false
num_retrieved_snippets=5
collapsed_output=true

[pr_config] # /config #

[pr_help_docs]
repo_url = "" #If not overwritten, will use the repo from where the context came from (issue or PR)
repo_default_branch = "main"
docs_path = "docs"
exclude_root_readme = false
supported_doc_exts = [".md", ".mdx", ".rst"]
enable_help_text=false

[doc_drift] # /doc_drift #
enabled = true
trigger_on_command = true              # allow the manual /doc_drift command
trigger_on_mr = false                  # reserved, currently unused (no code reads this key; real gate is [gitlab].pr_commands + show_in_review below)
call_strategy = "single"               # single (A, default) | per_doc (B, reserved)
model = "anthropic/claude-sonnet-4-5-20250929"  # verified stable/compliant model; empty -> config.model_weak/config.model
fallback_models = ["anthropic/claude-haiku-4-5-20251001"]
repo_url = ""                          # if empty, deduced from the MR context
global_docs = ["AGENTS.md", "README.md", "docs/**/*.md"]
ancestor_doc_globs = ["*.md", "README*"]
doc_exts = [".md", ".mdx", ".rst"]
severity_threshold = "medium"          # only report medium and above
max_docs_per_mr = 30                   # cap to avoid blowing up the context window / cost
max_doc_chars = 20000                  # per-doc content trim length
report_collapsed = true                # default multi-level collapsed report
show_in_review = false                 # show doc-drift row inside /review output; false also skips running detection entirely (see pr_reviewer.py gate)

[github]
# The type of deployment to create. Valid values are 'app' or 'user'.
deployment_type = "user"
ratelimit_retries = 5
base_url = "https://api.github.com"
publish_inline_comments_fallback_with_verification = true
try_fix_invalid_inline_comments = true
app_name = "pr-agent"
ignore_bot_pr = true

[github_action_config]
# auto_review = true    # set as env var in .github/workflows/pr-agent.yaml
# auto_describe = true  # set as env var in .github/workflows/pr-agent.yaml
# auto_improve = true   # set as env var in .github/workflows/pr-agent.yaml
# pr_actions = ['opened', 'reopened', 'ready_for_review', 'review_requested']

[github_app]
# these toggles allows running the github app from custom deployments
bot_user = "github-actions[bot]"
override_deployment_type = true
# settings for "pull_request" event
handle_pr_actions = ['opened', 'reopened', 'ready_for_review']
pr_commands = [
    "/describe --pr_description.final_update_message=false",
    "/review",
    "/improve",
]
# settings for "pull_request" event with "synchronize" action - used to detect and handle push triggers for new commits
handle_push_trigger = false
push_trigger_ignore_bot_commits = true
push_trigger_ignore_merge_commits = true
push_trigger_wait_for_initial_review = true
push_trigger_pending_tasks_backlog = true
push_trigger_pending_tasks_ttl = 300
push_commands = [
    "/describe",
    "/review",
]

[gitlab]
url = "https://gitlab.com"
