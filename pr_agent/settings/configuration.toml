webhook_secret_validation_mode = "optional" # strict | optional | off
pr_commands = [
    "/describe --pr_description.final_update_message=false",
    "/mr_create",
]
handle_push_trigger = false
push_commands = [
    "/describe",
    "/review",
]

# 新增
ignore_bot_user = true
bot_user_allowlist = ["eabot_devops"]

[suggestion_review_dashboard]
enabled = true                       # track MR coverage and review-run status
history_started_at = "2026-08-06T15:08:00+08:00" # retain the existing dashboard history
sync_enabled = true                  # reconcile webhook inventory from GitLab metadata API
sync_interval_seconds = 600          # incremental synchronization cadence
sync_overlap_seconds = 600           # overlap cursor to avoid boundary misses
sync_lease_seconds = 180             # cross-process synchronization lease
initial_lookback_days = 30            # first-start inventory backfill window
reconcile_interval_seconds = 86400   # full reconciliation cadence
reconcile_lookback_hours = 48         # daily reconciliation window
not_triggered_after_seconds = 900     # grace period before showing “not triggered”
run_timeout_seconds = 7200            # stale running rows become execution failures in the dashboard
