[repair_report]
enabled = true
max_input_tokens = 24000
max_output_tokens = 1800
max_files = 40
max_hunks_per_file = 20
max_lines_per_file = 400
max_line_chars = 500
model_timeout_seconds = 120
max_active_per_worker = 1

[repair_memory]
capture_enabled = true
retrieval_mode = "inject" # off, shadow, inject
promotion_enabled = true
project_allowlist = ["*"] # empty enables no project; "*" explicitly enables all projects
max_hints = 3
max_prompt_chars = 2000
min_score = 60
retrieval_timeout_ms = 75
stale_days = 180
global_min_projects = 2
needs_review_min_attempts = 3
needs_review_confidence = 0.45
episode_retention_days = 365
hit_retention_days = 365
consolidation_batch_size = 50
consolidation_lease_seconds = 300
consolidation_model_timeout_seconds = 60
consolidation_poll_seconds = 60
embedding_service_url = "http://bge-m3-service:8080"
embedding_model_name = "BAAI/bge-m3"
embedding_model_revision = "5617a9f61b028005a4858fdac845db406aefb181"
embedding_dimensions = 1024
semantic_timeout_ms = 1500
embedding_batch_timeout_seconds = 30.0
embedding_batch_size = 16
semantic_min_similarity = 0.55
semantic_candidate_limit_per_scope = 500
project_initial_confidence = 0.60
global_initial_confidence = 0.70
support_confidence_increment = 0.05
success_confidence_increment = 0.03
failure_confidence_decrement = 0.02

[ci_failure_dashboard]
capture_enabled = false
tracking_started_at = "2026-08-20T00:00:00+08:00"
trace_job_limit = 20
trace_bytes_limit = 131072
format_keywords = ["code_format_check", "format"]
clang_keywords = ["clang", "clang-tidy"]
coverage_keywords = ["coverage"]
test_keywords = ["test", "pytest", "gtest", "unittest"]
build_keywords = ["build", "compile", "cmake", "ninja", "link"]
infrastructure_patterns = [
    "connection timed out",
    "connection reset",
    "runner system failure",
    "no space left on device",
    "failed to pull image",
    "service unavailable",
    "temporary failure in name resolution",
]
reconcile_enabled = false
reconcile_lookback_days = 30
reconcile_max_mrs = 200
reconcile_max_pipelines = 500
reconcile_max_traces = 1000

[feishu]
app_id = "cli_aac77ad9b6785cf9" # Feishu App ID (recommended to set in .secrets.toml or FEISHU_APP_ID)
app_secret = "r6rbcoRMROc9OouXg6N38gPja02PKCFv" # Feishu App Secret (recommended to set in .secrets.toml or FEISHU_APP_SECRET)
identity_cache_ttl_seconds = 604800 # Cache Open ID to display-name lookups for seven days
long_connection_enabled = true # Enable Feishu long-connection worker
long_connection_auto_start = true # Auto-start worker inside gitlab_webhook service process
long_connection_retry_seconds = 5 # Retry interval when ws client exits or fails to connect
card_callback_timeout_seconds = 2.5 # Return button callbacks before Feishu's 3-second deadline
card_callback_max_age_seconds = 300 # Reject delayed/replayed card callbacks older than 5 minutes
email_domain = "" # e.g. "example.com": map gitlab username -> <username>@<domain> -> feishu open_id
push_card_on_mr_open = false # deprecated: notifications now trigger on failed pipeline webhook instead of MR open
notify_on_pipeline_failure = true # push a Feishu card only when the MR-related pipeline finishes with failed status
update_triage_cards = true # update the originating pipeline-failure card as triage progresses
triage_failure_explanations = true # show bounded confirmed/inferred reasons for terminal failed Jobs
multi_action_repair_cards = true # keep all pipeline failure repair actions on one versioned card
unified_pipeline_repair = true # expose one recoverable repair workflow; false restores category-specific buttons
repair_card_mode = "multi_select" # multi_select, unified, or legacy_actions; affects newly created cards only
triage_card_ttl_seconds = 2592000 # keep task/card correlation for 30 days
repair_details_enabled = false # additive owner-details trial; existing cards stay unchanged when disabled
repair_details_base_url = "" # public HTTP(S) origin; signing secret is environment-only
repair_details_event_limit = 200 # cap per-task owner-facing progress events
repair_details_retention_seconds = 2592000 # retain live progress for 30 days before SQLite-only fallback
repair_details_heartbeat_seconds = 15 # SSE keepalive interval
repair_details_diff_max_files = 30 # cap inline repair-diff files per task
repair_details_diff_max_hunks_per_file = 20 # cap stored hunks for one changed file
repair_details_diff_max_lines_per_file = 400 # cap stored diff lines for one changed file
repair_details_diff_max_line_chars = 500 # truncate unusually long source lines in owner reports
post_repair_ut_enabled = false # show an isolated UT action only after a fully successful Feishu repair
post_repair_ut_coverage_threshold = 80.0 # hide the UT action when known changed-lines coverage meets this value
pipeline_format_job_keywords = ["code_format_check", "format"] # failed jobs matching these keywords are treated as format failures
pipeline_clang_job_keywords = ["clang", "clang-tidy"] # failed jobs matching these keywords are treated as clang failures
pipeline_build_job_keywords = ["build", "compile", "cmake", "ninja", "coverage"] # failed jobs matching these keywords are treated as build failures

[feishu.user_map] # optional static fallback mapping: gitlab_username -> feishu open_id
# "some_gitlab_username" = "ou_xxxxxxxx"

