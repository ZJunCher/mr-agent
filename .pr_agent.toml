# -------------------------
# 文档同步检查 - 在 /review 时检查代码变更是否缺少关联文档更新
# -------------------------
[pr_reviewer]
extra_instructions = """\
额外检查：代码与文档同步性审查。
请检查本次 PR 修改的代码文件是否有对应的文档/README/markdown 文件需要同步更新但未更新。

判断规则：
1. 如果修改了 pr_agent/tools/ 下的工具实现，检查 docs/docs/tools/ 下对应文档是否也被修改。
2. 如果修改了 pr_agent/settings/ 下的配置或 prompt，检查相关文档是否更新了配置说明。
3. 如果修改了 ut_agent/ 下的代码，检查 ut_agent/README.md 是否需要同步。
4. 如果新增了功能、参数、配置项，检查是否有对应的文档描述。
5. 如果修改了安装/部署流程相关代码，检查 docs/docs/installation/ 下文档是否更新。

如果发现代码有变更但关联文档未同步更新，请在 review 中明确指出：
- 哪些代码文件的变更需要文档同步
- 建议更新哪些文档文件
- 简要说明需要补充的文档内容

如果本次 PR 的变更不涉及用户可见行为或配置变化（如纯重构、bug fix 无接口变化），则无需文档同步，可跳过此检查。
"""

[feishu]
post_repair_ut_enabled = true
post_repair_ut_coverage_threshold = 80.0
