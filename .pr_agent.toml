# .pr_agent.toml 模板（示例文件）
# - PR-Agent 会从仓库默认分支根目录读取此文件，并将其中的配置覆盖到默认配置上。
# - 你可以只写某一个工具（例如 /describe）的 prompt，其它工具不写则不会受影响。
# - 文件顶部包含本仓库已启用的大 MR 与 Skill 评测配置；后面的自定义 Prompt 仍全部注释。
# - 自定义 prompt 时，system/user 都可以改；也可以只改其中一个
#

[large_mr_review]
enabled = true
output_buffer_tokens = 1500
chunk_metadata_tokens = 256
max_chunks = 20
max_concurrency = 4
fail_closed = true

[prompt_evolution]
project_skill_high_fidelity_enabled = true
project_skill_high_fidelity_gate_mode = "enforce"
project_skill_high_fidelity_min_mrs = 1
project_skill_high_fidelity_max_mrs = 10
project_skill_canary_enabled = false
project_skill_canary_percent = 0
project_skill_canary_approved_ref = ""

